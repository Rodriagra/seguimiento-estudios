services:
  seguimiento-estudios:
    # Cuando tengas el paquete publicado en GHCR (ver README, paso 0), usa esta imagen:
    image: ghcr.io/rodriagra/seguimiento-estudios:latest
    # Para construir localmente en vez de tirar de GHCR, comenta la línea "image" y descomenta esta:
    # build: .
    container_name: seguimiento-estudios
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /mnt/tank/appdata/seguimiento-estudios:/app/data
    environment:
      - PORT=3000
      - DB_PATH=/app/data/estudios.db
      # Si el volumen en el host pertenece a otro usuario (PUID/PGID 568 típico de TrueNAS SCALE),
      # asegúrate de que /mnt/tank/appdata/seguimiento-estudios sea propiedad de ese uid/gid,
      # o fija aquí el usuario del contenedor:
      # user: "568:568"
    networks:
      - homelab-net
    labels:
      # Watchtower: autoactualiza el contenedor cuando hay nueva imagen en GHCR
      - com.centurylinklabs.watchtower.enable=true
      # Traefik (ejemplo, ajusta el host a tu convención local, sin Let's Encrypt)
      - traefik.enable=true
      - traefik.http.routers.estudios.rule=Host(`estudios.local`)
      - traefik.http.routers.estudios.entrypoints=web
      - traefik.http.services.estudios.loadbalancer.server.port=3000

networks:
  homelab-net:
    external: true
